spring.application.name=rokwell-transax

# =======================
# DATABASE
# =======================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/rockwelldb?allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =======================
# JPA / HIBERNATE
# =======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# =======================
# STARTUP MUTATION GATES
# =======================
transax.startup.sample-data.enabled=false
transax.validation.runner.enabled=false

# =======================
# SPRING BATCH PROPERTIES
#========================
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:org/springframework/batch/core/schema-mysql.sql
spring.batch.job.enabled=true
spring.batch.job.name=demoJob

# Temporary diagnostic logging
logging.level.org.springframework.boot.autoconfigure.batch=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.springframework.batch=DEBUG
